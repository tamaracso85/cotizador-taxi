<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador Taxi Acapulco</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f6;color:#222}
.card{max-width:520px;margin:30px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 4px 18px #0002}
h1{margin-top:0;text-align:center}.btn{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#0b6efd;color:white;font-size:16px;cursor:pointer}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #bbb;border-radius:10px;font-size:16px;margin:8px 0 12px}
#resultado{margin-top:18px;padding:15px;border-radius:10px;background:#f1f5f9}
.whatsapp{background:#198754}
.small{font-size:13px;color:#666}
#estadoServicio{margin:12px 0;padding:12px;border-radius:10px;text-align:center;font-weight:bold}
.estado-activo{background:#dcfce7;color:#166534}
.estado-inactivo{background:#fee2e2;color:#991b1b}
.estado-error{background:#fef3c7;color:#92400e}
button:disabled{opacity:.55;cursor:not-allowed}
</style>
</head>
<body>
<div class="card">
<h1>🚕 Cotizador de Taxi</h1>
<p>Acapulco, Guerrero</p>
<div id="estadoServicio" class="estado-error">⏳ Verificando disponibilidad del servicio...</div>
<button class="btn" onclick="obtenerUbicacion()">📍 Usar mi ubicación</button>
<div id="ubicacion" class="small">Aún no se ha obtenido tu ubicación.</div>

<label>Si no puedes compartir tu ubicación, escribe tu origen:</label>
<input id="origenManual" placeholder="Ej. Colonia Centro, Acapulco">

<label>¿A dónde quieres ir?</label>
<input id="destino" placeholder="Ej. Zócalo de Acapulco">
<button id="btnCotizar" class="btn" onclick="cotizar()" disabled>💰 Calcular tarifa</button>
<div id="resultado">Ingresa tu destino para calcular.</div>
<a id="wa" href="https://wa.me/527444490147" target="_blank" style="text-decoration:none;pointer-events:none">
<button id="btnWhatsApp" class="btn whatsapp" disabled>📲 Solicitar taxi</button>
</a>
</div>
<script>
let pos=null;
let servicioActivo=false;
const SUPABASE_URL="https://denzagpozepvrdyzztxg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_P24mV2x-_JXHhkAa2kUbSQ_RSreYQhw";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

async function verificarServicio(){
const estado=document.getElementById("estadoServicio");
const btnCotizar=document.getElementById("btnCotizar");
const btnWhatsApp=document.getElementById("btnWhatsApp");
const wa=document.getElementById("wa");
try{
const {data,error}=await supabaseClient
.from("estado_servicio")
.select("servicio_activo")
.eq("id",1)
.single();
if(error) throw error;
servicioActivo=data.servicio_activo === true;
if(servicioActivo){
estado.className="estado-activo";
estado.textContent="🟢 Servicio disponible";
btnCotizar.disabled=false;
btnWhatsApp.disabled=false;
wa.style.pointerEvents="auto";
}else{
estado.className="estado-inactivo";
estado.textContent="🔴 Servicio no disponible en este momento";
btnCotizar.disabled=true;
btnWhatsApp.disabled=true;
wa.style.pointerEvents="none";
document.getElementById("resultado").textContent="El servicio no está disponible en este momento.";
}
}catch(error){
/* Respaldo: si Supabase no responde, el cotizador sigue funcionando. */
servicioActivo=true;
estado.className="estado-activo";
estado.textContent="🟢 Servicio disponible";
btnCotizar.disabled=false;
btnWhatsApp.disabled=false;
wa.style.pointerEvents="auto";
console.warn("Supabase no respondió; se activó el modo de respaldo.",error);
}
}
verificarServicio();

function obtenerUbicacion(){
if(!navigator.geolocation){
alert("Tu navegador no permite obtener la ubicación. Escribe tu origen manualmente.");
return;
}
navigator.geolocation.getCurrentPosition(
p=>{
pos={lat:p.coords.latitude,lon:p.coords.longitude};
document.getElementById("ubicacion").textContent="✅ Ubicación obtenida correctamente.";
},
e=>{
console.warn("Geolocalización:",e);
document.getElementById("ubicacion").textContent=
"⚠️ No fue posible obtener el GPS. Puedes escribir tu origen manualmente.";
alert("No se pudo obtener la ubicación. Si el navegador bloquea el GPS, escribe tu origen en el campo de origen.");
},
{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}
const destinosConocidos = {
"la gran plaza": {lat:16.861473, lon:-99.881912, nombre:"La Gran Plaza Acapulco"},
"gran plaza": {lat:16.861473, lon:-99.881912, nombre:"La Gran Plaza Acapulco"},
"hotel ritz": {lat:16.8506, lon:-99.9069, nombre:"Hotel Ritz Acapulco"},
"zocalo": {lat:16.8493, lon:-99.9081, nombre:"Zócalo de Acapulco"},
"zócalo": {lat:16.8493, lon:-99.9081, nombre:"Zócalo de Acapulco"},
"aeropuerto": {lat:16.7571, lon:-99.7537, nombre:"Aeropuerto Internacional de Acapulco"},
"aeropuerto acapulco": {lat:16.7571, lon:-99.7537, nombre:"Aeropuerto Internacional de Acapulco"},
"aca": {lat:16.7571, lon:-99.7537, nombre:"Aeropuerto Internacional de Acapulco"},
"calle 5 y emiliano zapata bella vista": {lat:16.863372, lon:-99.907922, nombre:"Calle 5 y Av. Emiliano Zapata, Col. Bella Vista"},
"calle 5 y emiliano zapata col bella vista": {lat:16.863372, lon:-99.907922, nombre:"Calle 5 y Av. Emiliano Zapata, Col. Bella Vista"}
};
function normalizarTexto(t){
return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
async function buscarDestino(destino){

  const texto = destino.trim();
  const normalizado = normalizarTexto(texto);

  // ==============================
  // DESTINOS CONOCIDOS
  // ==============================
  for(const k of Object.keys(destinosConocidos)){
    const clave = normalizarTexto(k);

    if(normalizado === clave){
      return destinosConocidos[k];
    }
  }

  for(const k of Object.keys(destinosConocidos).sort((a,b)=>b.length-a.length)){
    const clave = normalizarTexto(k);
    if(clave.length >= 12 && normalizado.includes(clave)){
      return destinosConocidos[k];
    }
  }

  // Cruces conocidos: aceptar variaciones naturales de escritura.
  // Ejemplo: "calle 5 y Emiliano Zapata col Bella Vista".
  const esCalle5BellaVista =
    /\bcalle\s*5\b/.test(normalizado) &&
    /\bemiliano\s+zapata\b/.test(normalizado) &&
    /\bbella\s+vista\b/.test(normalizado);

  if(esCalle5BellaVista){
    return destinosConocidos["calle 5 y emiliano zapata col bella vista"];
  }

  // ==============================
  // FUNCIONES AUXILIARES
  // ==============================
  function escaparRegex(valor){
    return valor.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  }

  function limpiarNombre(valor){
    return valor
      .replace(/\b(acapulco|guerrero|mexico|méxico)\b/gi,"")
      .replace(/\b(col|colonia|fracc|fraccionamiento)\b.*$/gi,"")
      .replace(/\b(esquina\s+con|esquina|con|y)\b/gi," ")
      .replace(/\b(av|ave|avenida|calle|c)\.?\b/gi," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function separarCruce(valor){

    let limpio = valor
      .replace(/\b(acapulco|guerrero|mexico|méxico)\b/gi," ")
      .replace(/\s+/g," ")
      .trim();

    const patrones = [
      /\s+esquina\s+con\s+/i,
      /\s+esquina\s+/i,
      /\s+y\s+/i,
      /\s+con\s+/i
    ];

    for(const patron of patrones){
      const partes = limpio.split(patron);

      if(partes.length === 2){
        return [
          limpiarNombre(partes[0]),
          limpiarNombre(partes[1])
        ];
      }
    }

    return null;
  }

// =============================
// BUSCAR INTERSECCIÓN REAL
// =============================

// =============================
// BUSCAR INTERSECCIÓN REAL
// =============================

async function buscarCruce(calle1, calle2){

    const normalizar = texto =>
        texto
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"")
            .replace(/\b(av|ave|avenida|calle|c|blvd|boulevard|carretera)\b/g," ")
            .replace(/[^\w\s]/g," ")
            .replace(/\s+/g," ")
            .trim();

    const prepararPatron = texto => {

        const palabras = normalizar(texto)
            .split(" ")
            .filter(p => p.length >= 2 || /^\d+$/.test(p));

        return palabras
            .map(p => p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))
            .join(".*");

    };

    const patron1 = prepararPatron(calle1);
    const patron2 = prepararPatron(calle2);

    if(!patron1 || !patron2){
        return null;
    }

    try{

        // Zona amplia de Acapulco
        const bbox = "16.70,-100.05,17.00,-99.65";

        const consulta = `
[out:json][timeout:25];

(
  way["highway"]["name"~"${patron1}",i](${bbox});
  way["highway"]["name"~"${patron2}",i](${bbox});
);

out body geom;
`;

        const url =
            "https://overpass-api.de/api/interpreter";

        const respuesta = await fetch(
            url,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body:
                    "data=" +
                    encodeURIComponent(consulta)
            }
        );

        if(!respuesta.ok){

            console.warn(
                "Overpass respondió con error:",
                respuesta.status
            );

            return null;
        }

        const datos = await respuesta.json();

        const elementos = datos.elements || [];

        const vias1 = [];
        const vias2 = [];

        for(const via of elementos){

            if(!via.tags || !via.tags.name){
                continue;
            }

            const nombre =
                normalizar(via.tags.name);

            const coincide1 =
                normalizar(calle1)
                    .split(" ")
                    .filter(p => p.length >= 2 || /^\d+$/.test(p))
                    .every(p =>
                        nombre.includes(p)
                    );

            const coincide2 =
                normalizar(calle2)
                    .split(" ")
                    .filter(p => p.length >= 2 || /^\d+$/.test(p))
                    .every(p =>
                        nombre.includes(p)
                    );

            if(coincide1){
                vias1.push(via);
            }

            if(coincide2){
                vias2.push(via);
            }
        }

        // Buscar un nodo compartido entre ambas calles
        for(const via1 of vias1){

            if(!via1.nodes || !via1.geometry){
                continue;
            }

            for(const via2 of vias2){

                if(!via2.nodes || !via2.geometry){
                    continue;
                }

                const nodos2 =
                    new Set(via2.nodes);

                for(let i = 0; i < via1.nodes.length; i++){

                    const nodo =
                        via1.nodes[i];

                    if(nodos2.has(nodo)){

                        const punto =
                            via1.geometry[i];

                        if(
                            punto &&
                            typeof punto.lat === "number" &&
                            typeof punto.lon === "number"
                        ){

                            return {
                                lat: punto.lat,
                                lon: punto.lon,
                                nombre:
                                    `${calle1} y ${calle2}, Acapulco`
                            };
                        }
                    }
                }
            }
        }

    }catch(error){

        console.warn(
            "Error buscando intersección en OpenStreetMap:",
            error
        );

    }

    return null;
}
  // ==============================
  // DETECTAR CRUCE
  // ==============================
  const cruce = separarCruce(texto);

  if(cruce){

    const resultadoCruce = await buscarCruce(
      cruce[0],
      cruce[1]
    );

    if(resultadoCruce){
      return resultadoCruce;
    }
  }

  // ==============================
  // BÚSQUEDA NORMAL
  // ==============================

  const consultas = [];

  consultas.push(
    `${texto}, Acapulco, Guerrero, México`
  );

  consultas.push(
    `${texto}, Acapulco de Juárez, Guerrero, México`
  );

  consultas.push(
    `${texto}, Acapulco, Guerrero`
  );

  consultas.push(
    `${texto}, Acapulco`
  );

  // ==============================
  // CONSULTAR NOMINATIM
  // ==============================

  for(const consulta of consultas){

    try{

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=8" +
        "&countrycodes=mx" +
        "&accept-language=es" +
        "&q=" +
        encodeURIComponent(consulta);

      const respuesta = await fetch(url);

      if(!respuesta.ok) continue;

      const resultados = await respuesta.json();

      if(resultados.length){

        // Priorizar Acapulco
       const candidatos = resultados.filter(x =>
  /Acapulco|Guerrero/i.test(
    (x.display_name || "") + " " +
    (x.address?.city || "") + " " +
    (x.address?.town || "") + " " +
    (x.address?.municipality || "") + " " +
    (x.address?.suburb || "") + " " +
    (x.address?.neighbourhood || "") + " " +
    (x.address?.village || "") + " " +
    (x.address?.district || "")
  )
);
  

        const mejor =
          candidatos[0] ||
          resultados[0];

        return {
          lat: Number(mejor.lat),
          lon: Number(mejor.lon),
          nombre:
            mejor.display_name ||
            texto
        };
      }

    }catch(error){

      console.error(
        "Error buscando destino:",
        error
      );

    }
  }

  return null;
}
async function cotizar(){
await verificarServicio();
if(!servicioActivo){
alert("El servicio no está disponible en este momento.");
return;
}

const destino=document.getElementById("destino").value.trim();
const origenManual=document.getElementById("origenManual").value.trim();

if(!pos && !origenManual){
alert("Primero usa tu ubicación o escribe tu origen manualmente.");
return;
}
if(!destino){
alert("Escribe tu destino.");
return;
}

const r=document.getElementById("resultado");
r.textContent="Preparando origen...";

try{
let origen=pos;

if(!origen){
const o=await buscarDestino(origenManual);
if(!o) throw new Error("Origen no encontrado");
origen={lat:o.lat,lon:o.lon};
document.getElementById("ubicacion").textContent="✅ Origen localizado correctamente.";
}

r.textContent="Buscando destino...";
const g=await buscarDestino(destino);
if(!g) throw new Error("Destino no encontrado");

r.textContent="Calculando ruta...";
const route=await fetch(
`https://router.project-osrm.org/route/v1/driving/${origen.lon},${origen.lat};${g.lon},${g.lat}?overview=false`
).then(x=>x.json());

if(!route.routes || !route.routes.length) throw new Error("Ruta no encontrada");

const km=route.routes[0].distance/1000;
const airport=/aeropuerto|acapulco international|ACA\b/i.test(destino);

let fare;
if(airport){fare=Math.max(300,Math.round(km*20/10)*10);}
else if(km<=3)fare=70;
else if(km<=5)fare=80;
else if(km<=7)fare=100;
else if(km<=9)fare=120;
else if(km<=11)fare=130;
else if(km<=13)fare=150;
else if(km<=15)fare=170;
else if(km<=18)fare=200;
else if(km<=21)fare=240;
else if(km<=24)fare=280;
else if(km<=27)fare=320;
else if(km<=30)fare=380;
else if(km<=35)fare=450;
else if(km<=40)fare=520;
else if(km<=45)fare=600;
else fare=700;

const nombreDestino=g.nombre || destino;
const mapas=`https://www.google.com/maps?q=${origen.lat},${origen.lon}`;

const mensaje=
`🚕 Solicitud de taxi\n\n`+
`📍 Mi ubicación: ${origen.lat.toFixed(6)}, ${origen.lon.toFixed(6)}\n`+
`🗺️ Ubicación en Google Maps: ${mapas}\n`+
`🎯 Destino: ${nombreDestino}\n`+
`📏 Distancia: ${km.toFixed(1)} km\n`+
`💰 Tarifa estimada: $${fare} MXN`;

document.getElementById("wa").href=
`https://wa.me/527444490147?text=${encodeURIComponent(mensaje)}`;

r.innerHTML=
`<b>Destino:</b> ${escapeHtml(nombreDestino)}<br>`+
`<b>Distancia:</b> ${km.toFixed(1)} km<br>`+
`<b>Tarifa estimada:</b> $${fare} MXN`+
(airport?`<br><span class='small'>Aeropuerto: tarifa especial provisional</span>`:"");

}catch(e){
console.error(e);
r.textContent=
"No encontramos el origen o destino. Revisa el texto e intenta nuevamente.";
}
}

function escapeHtml(text){
return String(text).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
}
</script>
</body>
</html>
