</a>
</div>
<script>
let pos=null;
let servicioActivo=false;
const SUPABASE_URL="https://denzagpozepvrdyzztxg.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_P24mV2x-_JXHhkAa2kUbSQ_RSreYQhw";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

async function verificarServicio(){
const estado=document.getElementById("estadoServicio");
const btnCotizar=document.getElementById("btnCotizar");
const btnWhatsApp=document.getElementById("btnWhatsApp");
const wa=document.getElementById("wa");
try{
const {data,error}=await supabaseClient
.from("estado_servicio")
.select("servicio_activo")
.eq("id",1)
.single();
if(error) throw error;
servicioActivo=data.servicio_activo === true;
if(servicioActivo){
estado.className="estado-activo";
estado.textContent="🟢 Servicio disponible";
btnCotizar.disabled=false;
btnWhatsApp.disabled=false;
wa.style.pointerEvents="auto";
}else{
estado.className="estado-inactivo";
estado.textContent="🔴 Servicio no disponible en este momento";
btnCotizar.disabled=true;
btnWhatsApp.disabled=true;
wa.style.pointerEvents="none";
document.getElementById("resultado").textContent="El servicio no está disponible en este momento.";
}
}catch(error){
/* Respaldo: si Supabase no responde, el cotizador sigue funcionando. */
servicioActivo=true;
estado.className="estado-activo";
estado.textContent="🟢 Servicio disponible";
btnCotizar.disabled=false;
btnWhatsApp.disabled=false;
wa.style.pointerEvents="auto";
console.warn("Supabase no respondió; se activó el modo de respaldo.",error);
}
}
verificarServicio();

function obtenerUbicacion(){
if(!navigator.geolocation){
alert("Tu navegador no permite obtener la ubicación. Escribe tu origen manualmente.");
return;
}
navigator.geolocation.getCurrentPosition(
p=>{
pos={lat:p.coords.latitude,lon:p.coords.longitude};
document.getElementById("ubicacion").textContent="✅ Ubicación obtenida correctamente.";
},
e=>{
console.warn("Geolocalización:",e);
document.getElementById("ubicacion").textContent=
"⚠️ No fue posible obtener el GPS. Puedes escribir tu origen manualmente.";
alert("No se pudo obtener la ubicación. Si el navegador bloquea el GPS, escribe tu origen en el campo de origen.");
},
{enableHighAccuracy:true,timeout:30000,maximumAge:0});
}

function normalizarTexto(t){
return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
async function buscarNominatimCanonico(consulta, nombrePreferido){
  try{
    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=jsonv2&limit=8&countrycodes=mx&accept-language=es&q=" +
      encodeURIComponent(consulta);

    const respuesta = await fetch(url);
    if(!respuesta.ok) return null;

    const resultados = await respuesta.json();
    if(!resultados.length) return null;

    const candidatos = resultados.filter(x =>
      /Acapulco|Guerrero/i.test(
        (x.display_name || "") + " " +
        (x.address?.city || "") + " " +
        (x.address?.town || "") + " " +
        (x.address?.municipality || "") + " " +
        (x.address?.suburb || "") + " " +
        (x.address?.neighbourhood || "") + " " +
        (x.address?.village || "")
      )
    );

    const base = (nombrePreferido || consulta || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9\s]/g," ")
      .split(/\s+/)
      .filter(p => p.length >= 3 && !["acapulco","guerrero","mexico","calle","avenida","av","colonia","col","fracc","fraccionamiento","numero","num"].includes(p));

    const puntuar = x => {
      const texto = ((x.display_name || "") + " " + JSON.stringify(x.address || {}))
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g," ");
      let puntos = 0;
      for(const token of base){
        if(texto.includes(token)) puntos++;
      }
      // Penaliza resultados claramente de otra categoría cuando se pidió una institución.
      if(/escuela|secundaria|colegio|hospital|terminal|walmart|restaurante|bar|parque|iglesia|museo/i.test(nombrePreferido || "")){
        if(!/school|college|hospital|bus|restaurant|bar|park|place|amenity|building|office|stadium/i.test(x.type || "")){
          puntos -= 1;
        }
      }
      return puntos;
    };

    const ordenados = (candidatos.length ? candidatos : resultados)
      .map(x => ({x, score:puntuar(x)}))
      .sort((a,b)=>b.score-a.score);

    const mejor = ordenados[0]?.x || resultados[0];
    if(!mejor) return null;

    // Para consultas canónicas institucionales exigimos coincidencia mínima;
    // esto evita casos como "Colegio Madrid" -> "Miguel de la Madrid".
    if(nombrePreferido && base.length >= 2 && puntuar(mejor) < 1){
      return null;
    }

    return {
      lat:Number(mejor.lat),
      lon:Number(mejor.lon),
      nombre:nombrePreferido || mejor.display_name || consulta
    };
  }catch(error){
    console.warn("Error en búsqueda canónica:", error);
    return null;
  }
}

async function buscarDestino(destino){

  const texto = destino.trim();
  const normalizado = normalizarTexto(texto);

  // Si es un destino conocido con coordenadas, usar el punto directo.
  // Si es un destino conocido por nombre popular/oficial, resolver su consulta canónica.
  const conocido = destinosConocidos[normalizado];
  if(conocido){
    if(typeof conocido.lat === "number" && typeof conocido.lon === "number"){
      return conocido;
    }
    if(conocido.query){
      const res = await buscarNominatimCanonico(conocido.query, conocido.nombre);
      if(res) return res;
    }
  }


  // ==============================
  // DESTINOS CONOCIDOS
  // ==============================
  for(const k of Object.keys(destinosConocidos)){
    const clave = normalizarTexto(k);

    if(normalizado === clave){
      return destinosConocidos[k];
    }
  }

  for(const k of Object.keys(destinosConocidos).sort((a,b)=>b.length-a.length)){
    const clave = normalizarTexto(k);
    if(clave.length >= 12 && normalizado.includes(clave)){
      return destinosConocidos[k];
    }
  }

  // Cruces conocidos: aceptar variaciones naturales de escritura.
  // Ejemplo: "calle 5 y Emiliano Zapata col Bella Vista".
  const esCalle5BellaVista =
    /\bcalle\s*5\b/.test(normalizado) &&
    /\bemiliano\s+zapata\b/.test(normalizado) &&
    /\bbella\s+vista\b/.test(normalizado);

  if(esCalle5BellaVista){
    return destinosConocidos["calle 5 y emiliano zapata col bella vista"];
  }

  // Variantes naturales del mismo cruce, incluso "Av. Zapata".
  const esCruceCalle5Zapata =
    /\bcalle\s*5\b/.test(normalizado) &&
    /\bzapata\b/.test(normalizado) &&
    /\b(y|con|esquina)\b/.test(normalizado);

  if(esCruceCalle5Zapata){
    return destinosConocidos["calle 5 y av zapata"];
  }

  // Calle + colonia: nunca buscar solo la calle si el usuario dio la colonia.
  const mCol = normalizado.match(/^(?:calle|c|av|avenida|rio|calzada)\s+(.+?)\s+(?:col|colonia)\s+(.+)$/);
  if(mCol){
    const calle = mCol[1].trim();
    const colonia = mCol[2].trim();
    const combinado = await buscarNominatimCanonico(`${calle}, ${colonia}, Acapulco, Guerrero, México`, `${calle}, Col. ${colonia}`);
    if(combinado) return combinado;
  }

  // ==============================
  // FUNCIONES AUXILIARES
  // ==============================
  function escaparRegex(valor){
    return valor.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  }

  function limpiarNombre(valor){
    return valor
      .replace(/\b(acapulco|guerrero|mexico|méxico)\b/gi,"")
      .replace(/\b(col|colonia|fracc|fraccionamiento)\b.*$/gi,"")
      .replace(/\b(esquina\s+con|esquina|con|y)\b/gi," ")
      .replace(/\b(av|ave|avenida|calle|c)\.?\b/gi," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function separarCruce(valor){

    let limpio = valor
      .replace(/\b(acapulco|guerrero|mexico|méxico)\b/gi," ")
      .replace(/\s+/g," ")
      .trim();

    const patrones = [
      /\s+esquina\s+con\s+/i,
      /\s+esquina\s+/i,
      /\s+y\s+/i,
      /\s+con\s+/i
    ];

    for(const patron of patrones){
      const partes = limpio.split(patron);

      if(partes.length === 2){
        return [
          limpiarNombre(partes[0]),
          limpiarNombre(partes[1])
        ];
      }
    }

    return null;
  }

async function buscarCruce(calle1, calle2){

    const normalizar = texto =>
        texto
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g,"")
            .replace(/\b(av|ave|avenida|calle|c|blvd|boulevard|carretera)\b/g," ")
            .replace(/[^\w\s]/g," ")
            .replace(/\s+/g," ")
            .trim();

    const prepararPatron = texto => {

        const palabras = normalizar(texto)
            .split(" ")
            .filter(p => p.length >= 2 || /^\d+$/.test(p));

        return palabras
            .map(p => p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))
            .join(".*");

    };

    const patron1 = prepararPatron(calle1);
    const patron2 = prepararPatron(calle2);

    if(!patron1 || !patron2){
        return null;
    }

    try{

        // Zona amplia de Acapulco
        const bbox = "16.70,-100.05,17.00,-99.65";

        const consulta = `
[out:json][timeout:25];

(
  way["highway"]["name"~"${patron1}",i](${bbox});
  way["highway"]["name"~"${patron2}",i](${bbox});
);

out body geom;
`;

        const url =
            "https://overpass-api.de/api/interpreter";

        const respuesta = await fetch(
            url,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },
                body:
                    "data=" +
                    encodeURIComponent(consulta)
            }
        );

        if(!respuesta.ok){

            console.warn(
                "Overpass respondió con error:",
                respuesta.status
            );

            return null;
        }

        const datos = await respuesta.json();

        const elementos = datos.elements || [];

        const vias1 = [];
        const vias2 = [];

        for(const via of elementos){

            if(!via.tags || !via.tags.name){
                continue;
            }

            const nombre =
                normalizar(via.tags.name);

            const coincide1 =
                normalizar(calle1)
                    .split(" ")
                    .filter(p => p.length >= 2 || /^\d+$/.test(p))
                    .every(p =>
                        nombre.includes(p)
                    );

            const coincide2 =
                normalizar(calle2)
                    .split(" ")
                    .filter(p => p.length >= 2 || /^\d+$/.test(p))
                    .every(p =>
                        nombre.includes(p)
                    );

            if(coincide1){
                vias1.push(via);
            }

            if(coincide2){
                vias2.push(via);
            }
        }

        // Buscar un nodo compartido entre ambas calles
        for(const via1 of vias1){

            if(!via1.nodes || !via1.geometry){
                continue;
            }

            for(const via2 of vias2){

                if(!via2.nodes || !via2.geometry){
                    continue;
                }

                const nodos2 =
                    new Set(via2.nodes);

                for(let i = 0; i < via1.nodes.length; i++){

                    const nodo =
                        via1.nodes[i];

                    if(nodos2.has(nodo)){

                        const punto =
                            via1.geometry[i];

                        if(
                            punto &&
                            typeof punto.lat === "number" &&
                            typeof punto.lon === "number"
                        ){

                            return {
                                lat: punto.lat,
                                lon: punto.lon,
                                nombre:
                                    `${calle1} y ${calle2}, Acapulco`
                            };
                        }
                    }
                }
            }
        }

    }catch(error){

        console.warn(
            "Error buscando intersección en OpenStreetMap:",
            error
        );

    }

    return null;
}
  // ==============================
  // DETECTAR CRUCE
  // ==============================
  const cruce = separarCruce(texto);

  if(cruce){

    const resultadoCruce = await buscarCruce(
      cruce[0],
      cruce[1]
    );

    if(resultadoCruce){
      return resultadoCruce;
    }
  }

  // ==============================
  // CALLE + COLONIA
  // ==============================
  // No buscar solamente la calle. Primero obligamos a que la consulta
  // conserve la colonia para evitar confundir calles con el mismo nombre.
  const patronCalleColonia =
    /^(?:calle|c\.?|av\.?|ave\.?|avenida)\s+(.+?)\s+(?:col\.?|colonia)\s+(.+)$/i;

  const calleColonia = texto.match(patronCalleColonia);

  if(calleColonia){
    const nombreCalle = calleColonia[1].trim();
    const nombreColonia = calleColonia[2].trim();

    const consultasCalleColonia = [
      `${nombreCalle}, ${nombreColonia}, Acapulco, Guerrero, México`,
      `Calle ${nombreCalle}, ${nombreColonia}, Acapulco, Guerrero, México`,
      `${nombreCalle} ${nombreColonia}, Acapulco, Guerrero, México`
    ];

    for(const consultaCC of consultasCalleColonia){
      const resultadoCC = await buscarNominatimCanonico(
        consultaCC,
        `Calle ${nombreCalle}, Col. ${nombreColonia}, Acapulco`
      );
      if(resultadoCC){
        return resultadoCC;
      }
    }
  }

  // ==============================
  // EVITAR RESULTADOS GENÉRICOS PELIGROSOS
  // ==============================
  // Una calle numerada sola NO debe resolverse automáticamente con Nominatim,
  // porque puede existir en varias colonias. Por ejemplo, "Calle 5" no debe
  // enviarse automáticamente a Ciudad Renacimiento. Pedimos colonia o cruce.
  if(/^calle\s+\d+[a-z]?$/i.test(normalizado)){
    throw new Error(`⚠️ ${texto}: hay varias calles con ese número en Acapulco.
Escribe la colonia o el cruce, por ejemplo: "Calle 5, Col. Bella Vista" o "Calle 5 y Av. Emiliano Zapata".`);
  }

  if(normalizado === "gasolinera" || normalizado === "chedraui" || normalizado === "walmart"){
    throw new Error("Destino ambiguo: especifica cuál. Por ejemplo: Walmart Icacos, Walmart Diamante o Walmart La Marina.");
  }
  if(normalizado === "secundaria" || normalizado === "escuela secundaria" || normalizado === "secundaria tecnica" || normalizado === "secundaria técnica" || normalizado === "secundaria federal"){
    throw new Error("Destino ambiguo: hay muchas secundarias en Acapulco. Especifica el número o nombre del plantel, por ejemplo: Secundaria Técnica 1, Técnica 78 o Federal 4.");
  }
  if(normalizado === "bora bora" || normalizado === "bora-bora"){
    throw new Error("Destino ambiguo: Bora Bora puede ser la Calle Bora Bora, en Lomas de Magallanes, o el Restaurante Bora Bora, en Las Brisas Marqués. Especifica cuál.");
  }
  if(normalizado === "mariscos el plebe alegre" || normalizado === "el plebe alegre"){
    throw new Error("Destino ambiguo: hay varias ubicaciones de El Plebe Alegre. Especifica Condesa, Costa Azul o Granjas del Marqués.");
  }
  if(normalizado === "colegio madrid"){
    throw new Error("Destino ambiguo: hay más de un Colegio Madrid en Acapulco. Especifica la colonia, zona o plantel.");
  }
  if(normalizado === "colegio español" || normalizado === "colegio espanol"){
    throw new Error("Destino ambiguo: hay más de un Colegio Español en Acapulco. Especifica la colonia, zona o plantel.");
  }
  if(normalizado === "mariscos los buzos" || normalizado === "los buzos"){
    throw new Error("Destino ambiguo: hay varias sucursales de Mariscos Los Buzos. Especifica la zona o sucursal.");
  }
  if(/^club\s+n(igh|ig)ht(?:\s+club)?$/i.test(normalizado) || normalizado === "club night" || normalizado === "club nigth"){
    throw new Error("Destino ambiguo: 'club night' es una categoría de bares/clubes nocturnos. Escribe el nombre del lugar, por ejemplo: Baby'O, Chicas Girls, Bar 10 o Tabú.");
  }

  // ==============================
  // BÚSQUEDA NORMAL
  // ==============================

  const consultas = [];

  consultas.push(
    `${texto}, Acapulco, Guerrero, México`
  );

  consultas.push(
    `${texto}, Acapulco de Juárez, Guerrero, México`
  );

  consultas.push(
    `${texto}, Acapulco, Guerrero`
  );

  consultas.push(
    `${texto}, Acapulco`
  );

  // ==============================
  // CONSULTAR NOMINATIM
  // ==============================

  for(const consulta of consultas){

    try{

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&limit=8" +
        "&countrycodes=mx" +
        "&accept-language=es" +
        "&q=" +
        encodeURIComponent(consulta);

      const respuesta = await fetch(url);

      if(!respuesta.ok) continue;

      const resultados = await respuesta.json();

      if(resultados.length){

        // Priorizar Acapulco
       const candidatos = resultados.filter(x =>
  /Acapulco|Guerrero/i.test(
    (x.display_name || "") + " " +
    (x.address?.city || "") + " " +
    (x.address?.town || "") + " " +
    (x.address?.municipality || "") + " " +
    (x.address?.suburb || "") + " " +
    (x.address?.neighbourhood || "") + " " +
    (x.address?.village || "") + " " +
    (x.address?.district || "")
  )
);
  

        const mejor =
          candidatos[0] ||
          resultados[0];

        return {
          lat: Number(mejor.lat),
          lon: Number(mejor.lon),
          nombre:
            mejor.display_name ||
            texto
        };
      }

    }catch(error){

      console.error(
        "Error buscando destino:",
        error
      );

    }
  }

  return null;
}
async function ajustarAPuntoVial(lat,lon){
  try{
    const data=await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lon},${lat}?number=1`).then(x=>x.json());
    if(data.waypoints && data.waypoints.length && data.waypoints[0].location){
      return {lat:Number(data.waypoints[0].location[1]),lon:Number(data.waypoints[0].location[0])};
    }
  }catch(error){ console.warn("No fue posible ajustar el punto a la vialidad:",error); }
  return {lat,lon};
}
async function obtenerRutaConReintento(origen,destino){
  const construir=async(o,g)=>fetch(`https://router.project-osrm.org/route/v1/driving/${o.lon},${o.lat};${g.lon},${g.lat}?overview=false`).then(x=>x.json());
  let route=await construir(origen,destino);
  if(route.routes && route.routes.length) return {route,origenUsado:origen,destinoUsado:destino};
  const [oAjustado,gAjustado]=await Promise.all([ajustarAPuntoVial(origen.lat,origen.lon),ajustarAPuntoVial(destino.lat,destino.lon)]);
  route=await construir(oAjustado,gAjustado);
  if(route.routes && route.routes.length) return {route,origenUsado:oAjustado,destinoUsado:gAjustado};
  return null;
}

function escapeHtml(text){
return String(text).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));
}
